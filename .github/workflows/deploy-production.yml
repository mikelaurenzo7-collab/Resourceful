name: Deploy Resourceful to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: resourceful-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate, stage, verify, and promote production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_ssX7cPECdHvXGFHSOuS9iXos
      VERCEL_PROJECT_ID: prj_j6M19RLIb5zIyju5W8J2meEDESqG
      CANONICAL_APP_URL: https://resourceful-7x38.vercel.app
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.RESOURCEFUL_SUPABASE_PROJECT_REF }}
      WIRELINE_SUPABASE_PROJECT_REF: ogenlhodmwvyacvnrsnj

    steps:
      - name: Verify deployment routing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in the GitHub production environment."
            exit 1
          fi
          if [ -z "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
            echo "::error::Set the GitHub production variable RESOURCEFUL_SUPABASE_PROJECT_REF to the dedicated Resourceful Supabase project ref."
            exit 1
          fi
          if [ "$EXPECTED_SUPABASE_PROJECT_REF" = "$WIRELINE_SUPABASE_PROJECT_REF" ]; then
            echo "::error::Resourceful production must never use the Wireline Supabase project."
            exit 1
          fi
          test "$VERCEL_ORG_ID" = "team_ssX7cPECdHvXGFHSOuS9iXos"
          test "$VERCEL_PROJECT_ID" = "prj_j6M19RLIb5zIyju5W8J2meEDESqG"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain contract
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.engines?.node !== '22.x') {
            throw new Error(`package.json engines.node must be 22.x, received ${pkg.engines?.node ?? 'missing'}`);
          }
          if (pkg.packageManager !== 'pnpm@9.15.5') {
            throw new Error(`packageManager must be pnpm@9.15.5, received ${pkg.packageManager ?? 'missing'}`);
          }
          NODE

      - name: Verify repository invariants
        run: |
          pnpm check:migrations
          pnpm check:operability

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application validation
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@51.6.1

      - name: Pull exact production project settings
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node - <<'NODE'
          const project = require('./.vercel/project.json');
          const expectedOrg = process.env.VERCEL_ORG_ID;
          const expectedProject = process.env.VERCEL_PROJECT_ID;
          if (project.orgId !== expectedOrg || project.projectId !== expectedProject) {
            throw new Error(
              `Vercel project mismatch: received ${project.orgId}/${project.projectId}, expected ${expectedOrg}/${expectedProject}`
            );
          }
          NODE

      - name: Repair canonical public app URL
        shell: bash
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          vercel env pull "$env_file" \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

          current_url="$(node --env-file="$env_file" -p 'process.env.NEXT_PUBLIC_APP_URL || ""')"
          if [ "$current_url" = "$CANONICAL_APP_URL" ]; then
            echo "NEXT_PUBLIC_APP_URL already matches the canonical origin."
          elif [ -z "$current_url" ]; then
            printf '%s' "$CANONICAL_APP_URL" | vercel env add \
              NEXT_PUBLIC_APP_URL production \
              --yes \
              --token="$VERCEL_TOKEN"
          else
            printf '%s' "$CANONICAL_APP_URL" | vercel env update \
              NEXT_PUBLIC_APP_URL production \
              --yes \
              --token="$VERCEL_TOKEN"
          fi

          vercel env pull "$env_file" \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

          repaired_url="$(node --env-file="$env_file" -p 'process.env.NEXT_PUBLIC_APP_URL || ""')"
          test "$repaired_url" = "$CANONICAL_APP_URL"

      - name: Verify production environment contract
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.vercel/.env.production.local - <<'NODE'
          const required = [
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_ANON_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'SUPABASE_PROJECT_REF',
            'OPENAI_API_KEY',
            'STRIPE_SECRET_KEY',
            'STRIPE_WEBHOOK_SECRET',
            'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY',
            'RESEND_API_KEY',
            'NEXT_PUBLIC_APP_URL',
            'CRON_SECRET',
            'REPORT_ACCESS_TOKEN_SECRET',
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            throw new Error(`Missing required Vercel production variables: ${missing.join(', ')}`);
          }

          if (process.env.NEXT_PUBLIC_APP_URL !== process.env.CANONICAL_APP_URL) {
            throw new Error(
              `NEXT_PUBLIC_APP_URL must equal ${process.env.CANONICAL_APP_URL}; received ${process.env.NEXT_PUBLIC_APP_URL}`
            );
          }

          const expectedSupabaseRef = process.env.EXPECTED_SUPABASE_PROJECT_REF?.trim();
          const configuredSupabaseRef = process.env.SUPABASE_PROJECT_REF?.trim();
          const wirelineSupabaseRef = process.env.WIRELINE_SUPABASE_PROJECT_REF?.trim();
          if (!expectedSupabaseRef) {
            throw new Error('RESOURCEFUL_SUPABASE_PROJECT_REF GitHub production variable is required.');
          }
          if (expectedSupabaseRef === wirelineSupabaseRef) {
            throw new Error('Resourceful production is explicitly forbidden from using the Wireline Supabase project.');
          }
          if (configuredSupabaseRef !== expectedSupabaseRef) {
            throw new Error(
              `Supabase project mismatch: Vercel has ${configuredSupabaseRef ?? 'missing'}, expected dedicated Resourceful ref ${expectedSupabaseRef}`
            );
          }

          let supabaseUrl;
          try {
            supabaseUrl = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          } catch {
            throw new Error('NEXT_PUBLIC_SUPABASE_URL is not a valid URL.');
          }
          const urlProjectRef = supabaseUrl.hostname.split('.')[0];
          if (urlProjectRef !== expectedSupabaseRef) {
            throw new Error(
              `NEXT_PUBLIC_SUPABASE_URL resolves to project ${urlProjectRef}, expected ${expectedSupabaseRef}`
            );
          }

          for (const name of ['CRON_SECRET', 'REPORT_ACCESS_TOKEN_SECRET']) {
            if ((process.env[name] ?? '').length < 32) {
              throw new Error(`${name} must be at least 32 characters.`);
            }
          }

          const secretMode = process.env.STRIPE_SECRET_KEY.startsWith('sk_live_')
            ? 'live'
            : process.env.STRIPE_SECRET_KEY.startsWith('sk_test_')
              ? 'test'
              : 'invalid';
          const publicMode = process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY.startsWith('pk_live_')
            ? 'live'
            : process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY.startsWith('pk_test_')
              ? 'test'
              : 'invalid';
          if (secretMode === 'invalid' || publicMode === 'invalid' || secretMode !== publicMode) {
            throw new Error(`Stripe key mode mismatch or invalid format: secret=${secretMode}, publishable=${publicMode}`);
          }
          NODE

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Stage production deployment without assigning domains
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --env RESOURCEFUL_BUILD_SHA="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          deployment_url="${deployment_url%/}"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Resourceful staged production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staged deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical domain: $CANONICAL_APP_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staged deployment identity and dependencies
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          cron_secret="$(node --env-file=.vercel/.env.production.local -p 'process.env.CRON_SECRET || ""')"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            --max-time 30 \
            --header "Authorization: Bearer $cron_secret" \
            "$DEPLOYMENT_URL/api/health" > /tmp/resourceful-staged-health.json
          node - "$GITHUB_SHA" /tmp/resourceful-staged-health.json <<'NODE'
          const fs = require('node:fs');
          const [expected, file] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (body.healthy !== true) {
            throw new Error(`Staged deployment is unhealthy: ${JSON.stringify(body.services ?? {})}`);
          }
          if (body.deployment?.commit !== expected) {
            throw new Error(`Staged deployment commit mismatch: ${body.deployment?.commit ?? 'missing'} !== ${expected}`);
          }
          if (body.deployment?.environment !== 'production') {
            throw new Error(`Staged environment is ${body.deployment?.environment ?? 'missing'}, expected production.`);
          }
          NODE

      - name: Promote verified deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          vercel promote "$DEPLOYMENT_URL" \
            --yes \
            --token="$VERCEL_TOKEN"

      - name: Verify canonical alias serves the promoted commit
        shell: bash
        run: |
          set -euo pipefail
          cron_secret="$(node --env-file=.vercel/.env.production.local -p 'process.env.CRON_SECRET || ""')"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --max-time 30 \
            --header "Authorization: Bearer $cron_secret" \
            "$CANONICAL_APP_URL/api/health" > /tmp/resourceful-canonical-health.json
          node - "$GITHUB_SHA" /tmp/resourceful-canonical-health.json <<'NODE'
          const fs = require('node:fs');
          const [expected, file] = process.argv.slice(2);
          const body = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (body.healthy !== true) {
            throw new Error(`Canonical deployment is unhealthy: ${JSON.stringify(body.services ?? {})}`);
          }
          if (body.deployment?.commit !== expected) {
            throw new Error(`Canonical alias is stale: ${body.deployment?.commit ?? 'missing'} !== ${expected}`);
          }
          if (body.deployment?.environment !== 'production') {
            throw new Error(`Canonical environment is ${body.deployment?.environment ?? 'missing'}, expected production.`);
          }
          NODE
