name: Deploy Resourceful to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: resourceful-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Verify deployment credentials
        shell: bash
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured in the GitHub production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static validation
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Resourceful production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical domain: https://resourceful-7x38.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical production health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            --max-time 30 \
            https://resourceful-7x38.vercel.app/api/health > /tmp/resourceful-health.json
          cat /tmp/resourceful-health.json
