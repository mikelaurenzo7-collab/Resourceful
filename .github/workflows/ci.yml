name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      AI_PROVIDER_FAST: anthropic
      AI_MODEL_PRIMARY: claude-sonnet-4-6
      AI_MODEL_FAST: claude-haiku-4-5-20251001
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://resourceful.example
      CRON_SECRET: ci-cron-secret-00000000000000000000000000000000
      ATTOM_API_KEY: ci-placeholder-attom-key
      REPORT_ACCESS_TOKEN_SECRET: ci-report-access-secret-000000000000000000000000000000000000000000000000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
